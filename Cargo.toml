[package]
name = "glock"
authors = ["Aaron Glaza <akglaza@gmail.com>"]
version = "0.3.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
clap = { version = "4.6.1", features = ["derive"] }
clearscreen = "4.0.6"
clipboard = "0.5.0"
colored = "3.1.1"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
homedir = "0.3.6"
rand = "0.10.1"
random_word = { version = "0.5.2", features = ["en"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
